name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    # Windows too: most users are on it, and Windows-only bugs (CRLF, paths, locked
    # files) don't show up on Linux. macOS: the Apple Silicon release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Paddle only: the test suite exercises the PaddleOCR path; EasyOCR's PyTorch is
      # covered by the on-demand install tests without being installed here.
      - run: uv sync --locked --extra paddle
      - run: uv run ruff check src/docbox tests
      - run: uv run pytest

  website:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: website/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  desktop:
    # The GPUI desktop app (desktop/): builds on every platform and runs its tests, among
    # them the contract test against the real backend (Linux and macOS; it needs the
    # repository's .venv, hence the uv sync).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libasound2-dev libzstd-dev
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
