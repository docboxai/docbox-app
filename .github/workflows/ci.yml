name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    # Windows too: most users are on it, and Windows-only bugs (CRLF, paths, locked
    # files) don't show up on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Paddle only: the test suite exercises the PaddleOCR path; EasyOCR's PyTorch is
      # covered by the on-demand install tests without being installed here.
      - run: uv sync --locked --extra paddle
      - run: uv run ruff check src/docbox tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build

  shell:
    # Windows too: main.rs has Windows-only code (process-tree kill, no console window)
    # that a Linux build never compiles.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # build.rs copies `uv` from PATH as the sidecar when none is present.
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build checks that frontendDist exists.
      - run: mkdir -p frontend/dist
      - run: cargo check --manifest-path src-tauri/Cargo.toml
