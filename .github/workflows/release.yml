name: Release

# Releases come only from main. Bump the version in tauri.conf.json, pyproject.toml and
# src-tauri/Cargo.toml on main, then push a tag like v0.2.0 on that main commit. The
# `check` job refuses anything else before an installer is built. Each `build` job makes
# one platform's installers; the `release` job names them DocBox-<version>-<os>-<arch>
# and puts them in a *draft* GitHub Release. Edit its list of changes, then publish it:
# that's when the app's update notice sees it. MSI needs a plain x.y.z version (no "-rc1"
# suffixes).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The uv bundled into the app as its Python/env manager. Bump deliberately.
  UV_VERSION: "0.12.3"
  # The Tauri CLI that builds and bundles the installers. Bump deliberately.
  TAURI_CLI_VERSION: "2.12.1"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and branches, so the tagged commit can be checked against main.
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Releases come only from main."
            exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          py=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cargo=$(python -c "import tomllib;print(tomllib.load(open('src-tauri/Cargo.toml','rb'))['package']['version'])")
          echo "tag=$tag tauri=$conf pyproject=$py cargo=$cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$py" ] && [ "$tag" = "$cargo" ] || {
            echo "::error::Version mismatch: bump all three to $tag on main before tagging"; exit 1; }

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            uv_asset: uv-x86_64-pc-windows-msvc.zip
            sidecar: uv-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            # The static musl build, so the AppImage's uv runs on any distro; Tauri
            # names sidecars by the app's own target triple (gnu).
            uv_asset: uv-x86_64-unknown-linux-musl.tar.gz
            sidecar: uv-x86_64-unknown-linux-gnu
          # Apple Silicon only: PaddlePaddle publishes no Intel macOS wheel. Not notarized
          # (no Apple Developer ID yet); tauri.conf.json signs it ad hoc so macOS doesn't
          # call the download damaged.
          - os: macos-latest
            uv_asset: uv-aarch64-apple-darwin.tar.gz
            sidecar: uv-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the pinned uv sidecar (checksum-verified)
        shell: bash
        run: |
          base="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}"
          curl -fsSLO "$base/${{ matrix.uv_asset }}"
          curl -fsSLO "$base/${{ matrix.uv_asset }}.sha256"
          # macOS has shasum but not sha256sum.
          if command -v sha256sum >/dev/null; then sha256sum -c "${{ matrix.uv_asset }}.sha256"
          else shasum -a 256 -c "${{ matrix.uv_asset }}.sha256"; fi
          mkdir -p src-tauri/binaries uv-unpacked
          python - <<'EOF'
          import pathlib, shutil, tarfile, zipfile
          asset = "${{ matrix.uv_asset }}"
          if asset.endswith(".zip"):
              zipfile.ZipFile(asset).extractall("uv-unpacked")
          else:
              tarfile.open(asset).extractall("uv-unpacked")
          name = "uv.exe" if asset.endswith(".zip") else "uv"
          found = next(pathlib.Path("uv-unpacked").rglob(name))
          dest = pathlib.Path("src-tauri/binaries/${{ matrix.sidecar }}")
          shutil.copy2(found, dest)
          dest.chmod(0o755)
          print("sidecar:", dest)
          EOF

      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Third-party actions that build what goes into the installers are pinned to a commit.
      - uses: cargo-bins/cargo-binstall@7bebc2e59eb8820162b7ac8f62a92bfdb2732447 # v1.25.1
      - run: cargo binstall tauri-cli@=${{ env.TAURI_CLI_VERSION }} --no-confirm

      # From the repository root, so the CLI takes frontend/ as the frontend directory and
      # runs tauri.conf.json's beforeBuildCommand there.
      - name: Build the installers
        run: cargo tauri build

      # The installers only, not Tauri's staging folders beside them.
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          # Long enough to re-run the release job.
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      # Creates the draft release and uploads the installers to it.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers

      # One file per installer, named like DocBox-0.2.0-windows-x86-64.exe. `mv` fails if a
      # pattern matches no file or several, and anything left over fails the job, so a
      # missing or unexpected installer never goes out silently.
      - name: Name the installers
        run: |
          shopt -s globstar
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          mv installers/**/*-setup.exe     "dist/DocBox-$v-windows-x86-64.exe"
          mv installers/**/*.msi           "dist/DocBox-$v-windows-x86-64.msi"
          mv installers/**/*.dmg           "dist/DocBox-$v-macos-arm-64.dmg"
          mv installers/**/*.AppImage      "dist/DocBox-$v-linux-x86-64.AppImage"
          mv installers/**/*.deb           "dist/DocBox-$v-linux-x86-64.deb"
          mv installers/**/*.rpm           "dist/DocBox-$v-linux-x86-64.rpm"
          left=$(find installers -type f)
          [ -z "$left" ] || { echo "::error::Built but not released: $left"; exit 1; }
          ls -l dist

      # GitHub's list of changes since the last release, to edit in the draft. If this
      # fails after the draft exists, delete the draft and re-run the job.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
            echo
            echo "DocBox isn't code-signed yet. If Windows or macOS blocks it, see [Install](https://github.com/$GH_REPO#install) in the README."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "DocBox $GITHUB_REF_NAME" --notes-file notes.md
