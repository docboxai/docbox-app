name: Release

# Releases come only from main. Bump the version in pyproject.toml, desktop/Cargo.toml and
# desktop/Packager.toml on main, then push a tag like v0.2.0 on that main commit. The
# `check` job refuses anything else before an installer is built. Each `build` job makes
# one platform's installers with cargo-packager, signed for the in-app updater; the
# `release` job names them DocBox-<version>-<os>-<arch>, writes the updaters' manifests and
# puts them all in a *draft* GitHub Release. Edit its list of changes, then publish it:
# that's when installed copies see the update. MSI needs a plain x.y.z version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The uv bundled into the app as its Python/env manager. Bump deliberately.
  UV_VERSION: "0.12.3"
  # The packager that builds the installers and signs them. Bump deliberately.
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and branches, so the tagged commit can be checked against main.
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Releases come only from main."
            exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(python -c "import tomllib;print(tomllib.load(open('desktop/Packager.toml','rb'))['version'])")
          py=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cargo=$(python -c "import tomllib;print(tomllib.load(open('desktop/Cargo.toml','rb'))['package']['version'])")
          echo "tag=$tag packager=$conf pyproject=$py cargo=$cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$py" ] && [ "$tag" = "$cargo" ] || {
            echo "::error::Version mismatch: bump all three to $tag on main before tagging"; exit 1; }

      # Every installed copy, back to 0.1.0, only accepts updates signed with this key (the
      # secret keeps its first name; cargo-packager reads the same key format).
      - name: Check the updater signing key is set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || {
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (README: Releasing)"
            exit 1; }

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            uv_asset: uv-x86_64-pc-windows-msvc.zip
            sidecar: uv-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            # The glibc build (glibc 2.17+), not the static musl one: the AppImage step
            # adds a library path to every program in usr/bin, and the static musl uv
            # crashes on start after that. The AppImage needs glibc anyway.
            uv_asset: uv-x86_64-unknown-linux-gnu.tar.gz
            sidecar: uv-x86_64-unknown-linux-gnu
          # Apple Silicon only: PaddlePaddle publishes no Intel macOS wheel. Not notarized
          # (no Apple Developer ID yet); Packager.toml signs it ad hoc so macOS doesn't
          # call the download damaged.
          - os: macos-latest
            uv_asset: uv-aarch64-apple-darwin.tar.gz
            sidecar: uv-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the pinned uv to bundle (checksum-verified)
        shell: bash
        run: |
          base="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}"
          curl -fsSLO "$base/${{ matrix.uv_asset }}"
          curl -fsSLO "$base/${{ matrix.uv_asset }}.sha256"
          # macOS has shasum but not sha256sum.
          if command -v sha256sum >/dev/null; then sha256sum -c "${{ matrix.uv_asset }}.sha256"
          else shasum -a 256 -c "${{ matrix.uv_asset }}.sha256"; fi
          mkdir -p desktop/binaries uv-unpacked
          python - <<'EOF'
          import pathlib, shutil, tarfile, zipfile
          asset = "${{ matrix.uv_asset }}"
          if asset.endswith(".zip"):
              zipfile.ZipFile(asset).extractall("uv-unpacked")
          else:
              tarfile.open(asset).extractall("uv-unpacked")
          name = "uv.exe" if asset.endswith(".zip") else "uv"
          found = next(pathlib.Path("uv-unpacked").rglob(name))
          dest = pathlib.Path("desktop/binaries/${{ matrix.sidecar }}")
          shutil.copy2(found, dest)
          dest.chmod(0o755)
          print("bundled uv:", dest)
          EOF

      - name: GPUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libasound2-dev libzstd-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # Third-party actions that build what goes into the installers are pinned to a commit.
      - uses: cargo-bins/cargo-binstall@7bebc2e59eb8820162b7ac8f62a92bfdb2732447 # v1.25.1
      - run: cargo binstall cargo-packager@=${{ env.CARGO_PACKAGER_VERSION }} --no-confirm

      # With the key set, each installer also gets a .sig for the updater (and macOS an
      # .app.tar.gz, the form its updater installs).
      - name: Build the installers
        working-directory: desktop
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo packager --release

      # The app sets itself up with this uv on first launch, so a package whose uv doesn't
      # run is a package that can't start.
      - name: Check the uv in each Linux package runs
        if: runner.os == 'Linux'
        run: scripts/check_bundled_uv.sh desktop/target/release/packages "$UV_VERSION"

      # The installers and their signatures, not the packager's staging folders beside them.
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/target/release/packages/*-setup.exe
            desktop/target/release/packages/*.msi
            desktop/target/release/packages/*.dmg
            desktop/target/release/packages/*.AppImage
            desktop/target/release/packages/*.deb
            desktop/target/release/packages/*.app.tar.gz
            desktop/target/release/packages/*.sig
          if-no-files-found: error
          # Long enough to re-run the release job.
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      # Creates the draft release and uploads the installers to it.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers

      # One file per installer, named like DocBox-0.2.0-windows-x86-64.exe, each with its
      # updater signature beside it. `mv` fails if a pattern matches no file or several, and
      # anything left over fails the job, so a missing or unexpected file never goes out.
      - name: Name the installers
        run: |
          shopt -s globstar
          v="${GITHUB_REF_NAME#v}"
          mkdir dist sigs
          name() {  # <pattern> <released name>
            mv installers/**/$1     "dist/$2"
            mv installers/**/$1.sig "sigs/$2.sig"
          }
          name '*-setup.exe'  "DocBox-$v-windows-x86-64.exe"
          name '*.msi'        "DocBox-$v-windows-x86-64.msi"
          name '*.app.tar.gz' "DocBox-$v-macos-arm-64.app.tar.gz"
          name '*.AppImage'   "DocBox-$v-linux-x86-64.AppImage"
          name '*.deb'        "DocBox-$v-linux-x86-64.deb"
          # The .dmg is for first installs only; the updater uses the .app.tar.gz.
          mv installers/**/*.dmg "dist/DocBox-$v-macos-arm-64.dmg"
          left=$(find installers -type f)
          [ -z "$left" ] || { echo "::error::Built but not released: $left"; exit 1; }
          ls -l dist sigs

      # Two manifests, one per updater, both pointing at the files above:
      # - updates.json, read by the native app (cargo-packager's updater): "<os>-<arch>" with
      #   the file, its signature and its format.
      # - latest.json, read by copies from before it (0.1.x, Tauri's updater), which only
      #   accept that name and format: "<os>-<arch>-<installer>" first, then "<os>-<arch>".
      #   .rpm installs (no longer built) get no entry: their update check fails and they
      #   offer the download page instead.
      - name: Write the update manifests
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          from datetime import datetime, timezone
          tag = os.environ["GITHUB_REF_NAME"]
          v = tag.removeprefix("v")
          base = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{tag}"
          files = {
              "windows-x86_64": f"DocBox-{v}-windows-x86-64.exe",
              "windows-x86_64-nsis": f"DocBox-{v}-windows-x86-64.exe",
              "windows-x86_64-msi": f"DocBox-{v}-windows-x86-64.msi",
              "darwin-aarch64": f"DocBox-{v}-macos-arm-64.app.tar.gz",
              "darwin-aarch64-app": f"DocBox-{v}-macos-arm-64.app.tar.gz",
              "linux-x86_64": f"DocBox-{v}-linux-x86-64.AppImage",
              "linux-x86_64-appimage": f"DocBox-{v}-linux-x86-64.AppImage",
              "linux-x86_64-deb": f"DocBox-{v}-linux-x86-64.deb",
          }
          platforms = {
              key: {"url": f"{base}/{name}", "signature": pathlib.Path(f"sigs/{name}.sig").read_text().strip()}
              for key, name in files.items()
          }
          manifest = {
              "version": v,
              "notes": f"https://github.com/{os.environ['GH_REPO']}/releases/tag/{tag}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          native = {
              "windows-x86_64": (f"DocBox-{v}-windows-x86-64.exe", "nsis"),
              "macos-aarch64": (f"DocBox-{v}-macos-arm-64.app.tar.gz", "app"),
              "linux-x86_64": (f"DocBox-{v}-linux-x86-64.AppImage", "appimage"),
          }
          manifest["platforms"] = {
              key: {
                  "url": f"{base}/{name}",
                  "signature": pathlib.Path(f"sigs/{name}.sig").read_text().strip(),
                  "format": fmt,
              }
              for key, (name, fmt) in native.items()
          }
          pathlib.Path("dist/updates.json").write_text(json.dumps(manifest, indent=2) + "\n")
          EOF
          cat dist/latest.json dist/updates.json

      # GitHub's list of changes since the last release, to edit in the draft. If this
      # fails after the draft exists, delete the draft and re-run the job.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
            echo
            echo "DocBox isn't code-signed yet. If Windows or macOS blocks it, see [Install](https://github.com/$GH_REPO#install) in the README."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "DocBox $GITHUB_REF_NAME" --notes-file notes.md
