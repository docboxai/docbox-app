[package]
name = "docbox-desktop"
version = "0.1.1"
description = "Local, hassle-free OCR"
authors = ["DocBox AI team (Pranav and Pawan)"]
license = "Apache-2.0"
edition = "2024"
publish = false

[[bin]]
name = "docbox-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking calls, run on GPUI's background executor. rustls for the one HTTPS call (the
# update check); the backend is plain HTTP on loopback.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
url = "2"
dirs = "6"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
# kill(2) on a whole process group (backend.rs `signal_group`).
libc = "0.2"
