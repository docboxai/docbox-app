[project]
name = "docbox"
version = "0.1.1"
description = "Local, hassle-free OCR — set up and run open-source OCR models on your own machine"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "DocBox AI team (Pranav and Pawan)" }]
# Base install only: the API server and the light, pure-Python bits. Each engine family's
# heavy packages are an extra below, installed on demand by `core/runtime.py` the first
# time a user picks a model from that engine (or up front with `uv sync --all-extras`).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "psutil>=6.0",
    "platformdirs>=4.2",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.13",
    "requests>=2.31",
    "packaging>=23",
    "filelock>=3.15",
    "rapidfuzz>=3.9",
    # HTTPS against the OS trust store (core/tls.py), for networks with their own CA.
    "truststore>=0.10",
]

[project.scripts]
docbox = "docbox.cli.main:run"

[project.optional-dependencies]
# paddlepaddle 3.3 breaks oneDNN (`ConvertPirAttribute2RuntimeAttribute not support`), and
# without oneDNN its CPU convolutions take ~5 GB per megapixel of image: a tall screenshot
# ran out of memory (issue #23). 3.2 runs the same models with oneDNN in a fraction of that.
paddle = ["paddleocr>=2.9", "paddlepaddle>=3.2,<3.3"]
# torch/torchvision are listed directly so [tool.uv.sources] can pin them to the CPU-only
# index (sources only apply to direct dependencies); PyPI's Linux torch wheel bundles CUDA
# and is several times larger.
easyocr = ["easyocr>=1.7", "torch>=2.2", "torchvision>=0.17", "opencv-contrib-python"]
# The same engines built for NVIDIA graphics cards (CUDA 12.6), installed instead of the
# CPU ones when the user turns the graphics card on (core/runtime.py). Windows and Linux
# on x86_64 only, where both projects publish CUDA wheels; elsewhere they're empty.
# Paddle's CUDA wheels live on its own index, PyTorch's on its cu126 index (sources below).
# CUDA 12.6 rather than newer: it's the one build both publish for Windows and Linux
# (Paddle 3.2's CUDA 13 build is Linux-only), and it runs on drivers from 560 on.
paddle-gpu = [
    "paddleocr>=2.9 ; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "paddlepaddle-gpu>=3.2,<3.3 ; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    # Paddle's Windows wheel expects NVIDIA's CUDA toolkit and cuDNN installed system-wide;
    # these are the same libraries its Linux wheel depends on, as NVIDIA's own wheels, which
    # engines/cuda.py puts on the DLL search path before Paddle loads.
    "nvidia-cuda-runtime-cu12==12.6.77 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12==12.6.77 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.6.4.1 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.5.1.17 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-cufft-cu12==11.3.0.4 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-curand-cu12==10.3.7.77 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-cusolver-cu12==11.7.1.2 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-cusparse-cu12==12.5.4.2 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
    "nvidia-nvjitlink-cu12==12.6.85 ; platform_machine == 'AMD64' and sys_platform == 'win32'",
]
easyocr-gpu = [
    "easyocr>=1.7 ; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "torch>=2.2 ; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "torchvision>=0.17 ; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "opencv-contrib-python ; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]
# The MCP server for AI agents (`docbox mcp`): `uv tool install "docbox[agents] @ git+..."`.
# Not an engine, and not in the desktop app's runtime, which never runs it.
agents = ["mcp>=2.3"]

[dependency-groups]
dev = [
    # The MCP server's tests (and `uv run docbox mcp` from a checkout).
    "mcp>=2.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]
# easyocr wants opencv-python-headless, paddlex wants opencv-contrib-python, and both
# install the same `cv2` package: installing one engine overwrote the other's files and
# uninstalling it deleted them, breaking the engine left behind. Every engine shares the
# contrib build instead (a superset; listed in the easyocr extra for EasyOCR-only installs).
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]
# An engine's CPU and graphics-card builds install the same modules (`paddle`, `torch`), so
# only one of each pair can be in an environment; uv locks them as alternatives. The two
# graphics-card builds can't share one either: on Linux Paddle's pins NCCL 2.25.1 exactly
# and every torch CUDA 12.6 build another version, so one engine at a time uses the card.
conflicts = [
    [{ extra = "paddle" }, { extra = "paddle-gpu" }],
    [{ extra = "easyocr" }, { extra = "easyocr-gpu" }],
    [{ extra = "paddle-gpu" }, { extra = "easyocr-gpu" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "easyocr" },
    { index = "pytorch-cu126", extra = "easyocr-gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "easyocr" },
    { index = "pytorch-cu126", extra = "easyocr-gpu" },
]
paddlepaddle-gpu = { index = "paddle-cu126" }

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Engine package pins for standalone installs (scripts/export_pins.sh).
"docbox.backend.core" = ["pins/*.txt"]
# Published OCRBench scores for the benchmark graph.
"docbox.benchmark" = ["ocrbench.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_data_dir: reads models downloaded into the developer's real DocBox data folder; runs only with DOCBOX_TEST_REAL_DATA=1 (tests/conftest.py)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter declarations are evaluated once by design.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]
